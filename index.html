<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>D3 Narrative Visualization</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      color: #1f2933;
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 25px;
    }
    #scene-title {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 4px;
    }
    #scene-subtitle {
      font-size: 14px;
      color: #52606d;
      margin: 0 0 12px;
      max-width: 900px;
      min-height: 40px;
    }
    svg#chart {
      display: block;
      width: min(100%, 960px);
      height: auto;
      margin: 0 auto;
    }
    .bubble {
      fill: steelblue;
      stroke: #fff;
      stroke-width: 1.5px;
    }
    .bubble.muted {
      fill: #cbd5e1;
    }
    .bubble:hover {
      fill: orange;
    }
    .bubble-value {
      font-size: 13px;
      fill: #fff;
      pointer-events: none;
      text-anchor: middle;
    }
    .bubble-value.muted {
      fill: #52606d;
    }
    .bubble-name {
      font-size: 13px;
      font-weight: 600;
      fill: #1f2933;
      pointer-events: none;
      text-anchor: middle;
    }
    .bubble-name.muted {
      fill: #52606d;
      font-weight: 400;
    }
    .axis text {
      font-size: 13px;
      fill: #52606d;
    }
    .axis path,
    .axis line {
      stroke: #cbd5e1;
    }
    .annotation-text {
      font-size: 13px;
      font-weight: 600;
      fill: #1f2933;
    }
    .annotation-line {
      stroke: #52606d;
      stroke-width: 1;
      stroke-dasharray: 3 3;
    }
    .tooltip {
      position: absolute;
      background: #333;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      max-width: 260px;
      max-height: 220px;
      overflow-y: auto;
    }
    .tooltip strong {
      display: block;
      margin-bottom: 4px;
    }
    .tooltip ul {
      margin: 0;
      padding-left: 16px;
    }
    .tooltip li {
      white-space: normal;
    }
    #controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      width: 100%;
    }
    #controls > button {
      font: inherit;
      font-size: 14px;
      padding: 6px 14px;
      border: 1px solid #9aa5b1;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }
    #controls > button:hover:not(:disabled) {
      background: #f5f7fa;
    }
    #controls > button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #scene-progress {
      font-size: 13px;
      color: #52606d;
    }
    #scene-dots {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }
    .dot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #cbd5e1;
      border: none;
      padding: 0;
      cursor: pointer;
      font-size: 10px;
      color: #1f2933;
      line-height: 1;
    }
    .dot.active {
      background: #9aa5b1;
      color: #1f2933;
    }
  </style>
</head>
<body>

<h1 id="dashboard-title"></h1>
<h2 id="scene-title"></h2>
<p id="scene-subtitle"></p>

<svg id="chart"></svg>
<div class="tooltip"></div>

<div id="controls">
  <button id="prev" type="button">&#8592; Previous</button>
  <button id="next" type="button">Next &#8594;</button>
  <span id="scene-progress"></span>
  <span id="scene-dots"></span>
</div>

<script src="script.js"></script>

</body>
</html>
